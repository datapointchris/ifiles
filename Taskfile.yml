version: "3"

vars:
  BINARY_NAME: ifiles
  BUILD_DIR: .
  # The release installs into ~/go/bin, so the dev build replaces it there and
  # the next release replaces the dev build. A copy in ~/.local/bin, which
  # precedes ~/go/bin on PATH, would hide every later release.
  INSTALL_DIR: "{{.HOME}}/go/bin"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X github.com/datapointchris/ifiles/cmd.version={{.VERSION}}
    -X github.com/datapointchris/ifiles/cmd.commit={{.COMMIT}}
    -X github.com/datapointchris/ifiles/cmd.date={{.DATE}}

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # module cache comes back from go.sum.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - go mod download

  build:
    desc: Build the ifiles binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}"

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:coverage:
    desc: Run tests with an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report{{":"}} coverage.html"

  # gofumpt -l exits 0 whatever it lists, so the listing itself is the verdict.
  lint:
    desc: Run gofumpt, go vet, and golangci-lint
    cmds:
      - test -z "$(gofumpt -l . | tee /dev/stderr)"
      - go vet ./...
      - golangci-lint run ./...

  format:
    desc: Format the sources with gofumpt
    cmds:
      - gofumpt -w .

  install:
    desc: Install the dev build to ~/go/bin, where the release lives
    deps: [build]
    cmds:
      - install -m 755 {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}
      - echo "Installed{{":"}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BUILD_DIR}}/{{.BINARY_NAME}} coverage.out coverage.html
